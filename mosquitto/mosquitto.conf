# Mosquitto broker for HELM
# TCP listener for the ESP32 device and the Next.js server.
listener 1883

# Require authentication (see mosquitto/passwd). Never allow anonymous on a
# public host.
allow_anonymous false
password_file /mosquitto/config/passwd

# Persist retained messages (device status + config) across restarts.
persistence true
persistence_location /mosquitto/data/

# Log to stdout so `docker logs` shows broker activity.
log_dest stdout
log_type warning
log_type notice
log_type information
